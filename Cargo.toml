[workspace]
resolver = "2"
members = ["crates/engine", "crates/core", "crates/rec-cli", "app/src-tauri"]
# The Tauri app needs WebView system libraries on Linux; CI builds it on
# Windows and macOS explicitly. `cargo test` at the root covers the rest.
default-members = ["crates/engine", "crates/core", "crates/rec-cli"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "UNLICENSED"
publish = false

[workspace.dependencies]
notizli-engine = { path = "crates/engine" }
notizli-core = { path = "crates/core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
log = "0.4"
time = { version = "0.3", features = ["formatting", "parsing", "local-offset", "macros"] }

[profile.release]
opt-level = 3
lto = "thin"
strip = true
