[package]
name = "notizli-core"
description = "Talks to notizli.ch (pairing, upload) and keeps recordings safe on disk until they are accepted."
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
notizli-engine.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
log.workspace = true
time.workspace = true
reqwest = { version = "0.13", features = ["json", "multipart", "stream"] }
tokio = { version = "1", features = ["fs", "io-util", "time"] }
tokio-util = { version = "0.7", features = ["io"] }
futures-util = { version = "0.3", default-features = false }
keyring = "4"

[dev-dependencies]
tokio = { version = "1", features = ["fs", "io-util", "time", "macros", "rt-multi-thread", "net"] }
