name: CI

# Tests on Linux, Windows and macOS, and test builds as downloadable artifacts:
# the Windows installer, the macOS app (ad-hoc signed, Apple Silicon) and the
# Windows recording-test tool. Never publishes a release.
on:
  push:
  pull_request:
  workflow_dispatch: {}

permissions:
  contents: read

# A newer push to the same branch makes older runs pointless.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: WebView libraries for the app crate
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev
      - run: cargo clippy --workspace --all-targets
      - run: cargo test

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test
      - run: cargo build --release -p notizli-rec
      - name: Stage the recording test
        shell: bash
        run: |
          mkdir -p out
          cp target/release/notizli-rec.exe crates/rec-cli/windows/record-test.bat out/
      - uses: actions/upload-artifact@v4
        with:
          name: notizli-record-test-windows-${{ github.run_number }}
          path: out/
          retention-days: 30
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
        working-directory: app
      - name: Build the Windows installer
        run: npx tauri build --bundles nsis
        working-directory: app
      - uses: actions/upload-artifact@v4
        with:
          name: notizli-windows-installer-${{ github.run_number }}
          path: target/release/bundle/nsis/*.exe
          retention-days: 30

  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
        working-directory: app
      - name: Build the macOS app (ad-hoc signed)
        run: npx tauri build --bundles app,dmg
        working-directory: app
      - name: Show what went into the app
        run: |
          plutil -p target/release/bundle/macos/Notizli.app/Contents/Info.plist
          codesign -dv --entitlements - target/release/bundle/macos/Notizli.app 2>&1 || true
          lipo -info target/release/bundle/macos/Notizli.app/Contents/MacOS/Notizli
      - name: Pack the app (artifacts drop file permissions; a tarball keeps them)
        run: tar -czf Notizli-macOS.tar.gz -C target/release/bundle/macos Notizli.app
      - uses: actions/upload-artifact@v4
        with:
          name: notizli-macos-${{ github.run_number }}
          path: |
            target/release/bundle/dmg/*.dmg
            Notizli-macOS.tar.gz
          retention-days: 30
