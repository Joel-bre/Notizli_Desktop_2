name: Release (draft)

# Run by hand (Actions → "Release (draft)" → Run workflow). Builds the Windows
# installer and the macOS app for the version in Cargo.toml and attaches them
# to a DRAFT GitHub release, which nobody sees until it is published by hand.
# The app has no auto-update yet, so publishing never updates anyone.
on:
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: windows-latest
            bundles: nsis
            files: target/release/bundle/nsis/*.exe
          - os: macos-latest
            bundles: dmg
            files: target/release/bundle/dmg/*.dmg
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
        working-directory: app
      - run: npx tauri build --bundles ${{ matrix.bundles }}
        working-directory: app
      - uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.os }}
          path: ${{ matrix.files }}

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Create the draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          version=$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)
          gh release create "v$version" dist/* --draft --target "$GITHUB_SHA" \
            --title "Notizli $version" \
            --notes "Windows: run the .exe (click More info → Run anyway until the app is signed). Mac (Apple Silicon, macOS 14.4+): open the .dmg and drag Notizli to Applications; the first time, System Settings → Privacy & Security → Open Anyway."
